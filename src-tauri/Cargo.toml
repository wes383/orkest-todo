[package]
name = "orkest-todo"
version = "0.2.0"
description = "Orkest Todo"
authors = ["Orkest Todo"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "orkest_todo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` is what gives the app a system-tray presence; without it the
# 「关闭窗口 = 收进托盘」behaviour in `src/lib.rs` would leave the process with no
# way back to the foreground.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
# Second launch focuses the running window instead of starting a rival process —
# see the comment in `src/lib.rs`, this is a data-loss guard, not a nicety.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The export's native folder picker — see `save_csv_files` in `src/lib.rs`.
# A one-crate command instead of the dialog + fs plugins: the export only ever
# needs "ask once, write what the frontend already built", and this keeps the
# capability surface empty.
rfd = "0.15"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
