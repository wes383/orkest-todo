[package]
name = "orkest-todo"
version = "0.7.0"
description = "Orkest Todo"
authors = ["Orkest Todo"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "orkest_todo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` is what gives the app a system-tray presence; without it the
# 「关闭窗口 = 收进托盘」behaviour in `src/lib.rs` would leave the process with no
# way back to the foreground.
#
# `macos-private-api` is what makes `WebviewWindowBuilder::transparent` exist at
# all on macOS: it turns on `wry/transparent` + `wry/fullscreen` +
# `tauri-runtime/macos-private-api`, all of which are empty on Windows/Linux, so
# this line costs the other platforms nothing. It must be declared here *and* as
# `macOSPrivateApi: true` in tauri.conf.json — `tauri-build` diffs the two and
# fails the build when they disagree (in either direction). The price is private
# APIs on macOS, which rules out the App Store; this app ships GitHub Releases.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
# Second launch focuses the running window instead of starting a rival process —
# see the comment in `src/lib.rs`, this is a data-loss guard, not a nicety.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The export's native folder picker — see `save_csv_files` in `src/lib.rs`.
# A one-crate command instead of the dialog + fs plugins: the export only ever
# needs "ask once, write what the frontend already built", and this keeps the
# capability surface empty.
rfd = "0.15"
# 开机自启. Deliberately a plugin rather than a command of ours: the OS
# registration *is* the feature, and `auto-launch` already knows the three places
# such a flag lives — the Windows `Run` key, a macOS LaunchAgent plist, a Linux
# autostart `.desktop` — and how to quote an executable path into each. It is
# also the only plugin here the user can see from outside the app; the settings
# page's 启动 row is its face, and `autostart:default` in capabilities is its
# door.
tauri-plugin-autostart = "2"
# The OS-wide chord (⌃⌥F to flip focus). One chord rather than two: flipping
# the switch is the only move worth reaching for while the window is somewhere
# else, and the only one that needs no window at all. Registered by the plugin,
# turned on and off from the settings page — see `src/lib/global-shortcut.ts`
# for the frontend half.
tauri-plugin-global-shortcut = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
